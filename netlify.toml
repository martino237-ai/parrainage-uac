# L'application (React + Vite) se trouve dans le dossier "frontend".
[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage : toutes les routes (/admin, /projection, ...) servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
