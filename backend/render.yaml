services:
  - type: web
    name: parrainage-uac-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONT_URL
        value: https://serene-squirrel-debcfc.netlify.app
      - key: CORS_ORIGIN
        value: https://serene-squirrel-debcfc.netlify.app
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: parrainage_uac
      - key: DB_SSL
        value: "false"
