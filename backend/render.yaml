services:
  - type: web
    name: parrainage-uac-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONT_URL
        value: https://parrainage-uac-2026.netlify.app
      - key: CORS_ORIGIN
        value: https://parrainage-uac-2026.netlify.app
      - key: DATABASE_URL
        value: postgresql://postgres.zgexazuwcbafjblcinql:parrainage-uac@aws-0-eu-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      # Sur Render + Node Postgres, le pooler Supabase fonctionne bien sans sslmode=require.
      # Le driver accepte la connexion avec SSL actif, et le code ignore les certificats auto-signés.
